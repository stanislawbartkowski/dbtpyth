# Profile for dbt 2.0 (Fusion) using the "spark-connect" method, talking
# to a Spark Connect server (start one from /opt/spark with:
#   /opt/spark/sbin/start-connect-server.sh --packages org.apache.spark:spark-connect_2.12:3.5.6
# stop it with /opt/spark/sbin/stop-connect-server.sh).
#
# NOTE the host hack: Fusion's Spark ADBC driver (0.21.0.dev+dbt0.1.2,
# bundled with both 2.0.0a5 and 2.0.0-preview.207) builds the endpoint as
# sc://<host>:<port>/ -- and the Spark Connect client rejects a bare "/"
# path ("must be empty or have a proper parameter syntax"). Putting the
# port and a dummy URL parameter inside `host` (and omitting `port`)
# yields sc://localhost:15002/;use_ssl=false, which parses. With a plain
# host + port pair, every connection fails before reaching the server.
#
# `user` is not used by this driver version but newer Fusion builds
# require it for spark-connect, so keep it.
#
# Fusion does not support method=session (in-process PySpark) or Python
# models on Spark -- the Python model in this project will not run under
# Fusion.
#
# Normally this file lives at ~/.dbt/profiles.yml. It's included here for
# convenience; point DBT_PROFILES_DIR at this directory to use it, e.g.:
#   export DBT_PROFILES_DIR=$(pwd)

dbtpyth_demo:
  target: dev
  outputs:
    dev:
      type: spark
      method: spark-connect
      schema: analytics
      host: localhost:15002/;use_ssl=false
      user: stanislaw.bartkowski
